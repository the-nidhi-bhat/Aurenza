<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurenza — Produce Allocation & Dispatch Planner</title>
  <meta name="description" content="Explainable baseline-vs-planner produce allocation and dispatch decisions over engine-generated synthetic scenarios." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#faf5ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120e" media="(prefers-color-scheme: dark)" />
  <script>
    document.documentElement.classList.add('js');
    // theme before first paint: an explicit choice wins, otherwise follow the OS
    try {
      var t = localStorage.getItem('aurenza-theme');
      if (t !== 'dark' && t !== 'light') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* storage blocked: the light default stands */ }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="/assets/tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 4C12.5 4.6 6.6 9.3 5.2 16.4" />
            <path d="M4.5 19.5c3-6.4 7.4-10 13.5-11.6" />
            <circle cx="19" cy="5" r="1.4" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Aurenza</span>
          <span class="brand-sub">Produce allocation & dispatch</span>
        </span>
      </div>

      <nav class="viewswitch" role="tablist" aria-label="Dashboard views">
        <button class="vtab" role="tab" id="tab-overview" aria-controls="view-overview"
                aria-selected="true" tabindex="0">Overview</button>
        <button class="vtab" role="tab" id="tab-evaluation" aria-controls="view-evaluation"
                aria-selected="false" tabindex="-1">Evaluation</button>
      </nav>

      <span class="badge-synthetic"
            title="All figures are produced by the Aurenza engine from labelled synthetic fixtures — not observed real-world data.">
        <span class="dot" aria-hidden="true"></span>Synthetic data
      </span>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"
              aria-label="Switch to dark theme" title="Dark theme">
        <svg class="tt-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 14.6A8.4 8.4 0 0 1 9.5 3.6a8.4 8.4 0 1 0 10.9 11Z" />
        </svg>
        <svg class="tt-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.1" />
          <path d="M12 2.8v2.1M12 19.1v2.1M4.5 4.5l1.5 1.5M18 18l1.5 1.5M2.8 12h2.1M19.1 12h2.1M4.5 19.5 6 18M18 6l1.5-1.5" />
        </svg>
      </button>
    </div>
  </header>

  <main id="main" class="shell">
    <div id="loading" class="state state-loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading engine output…</span>
    </div>
    <p id="load-error" class="state state-error" role="alert" hidden></p>

    <!-- Overview: one committed scenario, straight from demo/result.json -->
    <section id="view-overview" class="view" role="tabpanel" aria-labelledby="tab-overview" tabindex="0" hidden>
      <div class="view-head">
        <div class="view-head-text">
          <h1>Decision detail</h1>
          <p class="view-sub" id="detail-meta"></p>
        </div>
        <span class="verdict" id="detail-verdict" hidden></span>
      </div>

      <div id="detail-notes" class="notes"></div>
      <div id="hero"></div>
      <div class="kpi-row" id="kpi-cards"></div>

      <section class="panel accent-planner">
        <div class="panel-head">
          <h2><span class="swatch planner" aria-hidden="true"></span>Planner plan</h2>
          <span class="panel-sub" id="planner-summary"></span>
        </div>
        <div id="planner-dispatches" class="table-wrap"></div>
      </section>

      <section class="panel accent-baseline">
        <div class="panel-head">
          <h2><span class="swatch baseline" aria-hidden="true"></span>Baseline plan (FEFO)</h2>
          <span class="panel-sub" id="baseline-summary"></span>
        </div>
        <div id="baseline-dispatches" class="table-wrap"></div>
      </section>

      <div class="panel-grid">
        <section class="panel">
          <div class="panel-head"><h2>Batch inventory & spoilage</h2></div>
          <div id="batch-table" class="table-wrap"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Accounting reconciliation</h2></div>
          <div id="recon"></div>
        </section>
      </div>
    </section>

    <!-- Evaluation: many synthetic scenarios from demo/evaluation.json -->
    <section id="view-evaluation" class="view" role="tabpanel" aria-labelledby="tab-evaluation" tabindex="0" hidden>
      <div class="view-head">
        <div class="view-head-text">
          <h1>Evaluation</h1>
          <p class="view-sub" id="eval-meta"></p>
        </div>
      </div>

      <div id="eval-notes" class="notes"></div>
      <div class="kpi-row" id="eval-cards"></div>
      <div class="chart-grid" id="eval-charts"></div>

      <section class="panel">
        <div class="panel-head">
          <h2>Scenario explorer</h2>
          <label class="field" for="scenario-select">
            <span>Scenario</span>
            <select id="scenario-select"></select>
          </label>
        </div>
        <div id="scenario-view"></div>
      </section>
    </section>
  </main>

  <footer id="footer" class="site-footer"></footer>

  <script src="app.js" defer></script>
</body>
</html>
